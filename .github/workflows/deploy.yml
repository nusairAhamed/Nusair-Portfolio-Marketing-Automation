name: CI/CD - Build & Deploy to VPS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Typecheck (CI)
  # -------------------------------------------------------------
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle (TypeCheck + Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Deploy to VPS (CD) - Runs only on push to master
  # -------------------------------------------------------------
  deploy:
    name: Deploy to VPS (167.86.92.95)
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Sync Files to VPS via SSH / rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rlgoDzP --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST != '' && secrets.VPS_HOST || '167.86.92.95' }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME != '' && secrets.VPS_USERNAME || 'root' }}
          REMOTE_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_TARGET_DIR != '' && secrets.VPS_TARGET_DIR || '/var/www/portfolio' }}
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.VPS_TARGET_DIR != '' && secrets.VPS_TARGET_DIR || '/var/www/portfolio' }}
          SCRIPT_AFTER: |
            echo "Setting proper permissions..."
            chmod -R 755 ${{ secrets.VPS_TARGET_DIR != '' && secrets.VPS_TARGET_DIR || '/var/www/portfolio' }}
            if command -v nginx > /dev/null; then
              echo "Testing and reloading Nginx..."
              nginx -t && systemctl reload nginx || true
            fi
            echo "Deployment to VPS 167.86.92.95 finished successfully!"
